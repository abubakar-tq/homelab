- name: install curl
  hosts: all 
  tasks:
   - name: Install curl
     ansible.builtin.apt:
       name: curl
       update_cache: true
       state: present


- name: install k3s server
  hosts: masters
  tasks:
   - name: Install k3s
     ansible.builtin.shell: "curl -sfL https://get.k3s.io | sh -"
     environment:
       INSTALL_K3S_EXEC: "server --kubelet-arg=feature-gates=KubeletInUserNamespace=true"
     register: k3s_install
     until: k3s_install.rc == 0
     retries: 5
     delay: 10

   - name: Read File
     ansible.builtin.slurp:
      src: /var/lib/rancher/k3s/server/node-token
     register: node_token
     no_log: true


- name: install k3s agent
  hosts: workers
  tasks:
   - name: Install k3s agent
     ansible.builtin.shell: "curl -sfL https://get.k3s.io | sh -"
     environment:
       K3S_URL: "https://{{ hostvars['master']['ansible_host'] }}:6443"
       K3S_TOKEN: "{{ hostvars['master']['node_token']['content'] | b64decode | trim }}"
       INSTALL_K3S_EXEC: "agent --kubelet-arg=feature-gates=KubeletInUserNamespace=true"
     register: k3s_agent_install
     until: k3s_agent_install.rc == 0
     retries: 5
     delay: 10

- name: verify cluster
  hosts: masters
  tasks:
   - name: Get cluster nodes
     ansible.builtin.command: kubectl get nodes -o wide
     register: cluster_nodes
     changed_when: false
     until: cluster_nodes.stdout_lines | length >= 4
     retries: 6
     delay: 10

   - name: show cluster nodes
     ansible.builtin.debug:
        msg: "{{ cluster_nodes.stdout_lines }}"
