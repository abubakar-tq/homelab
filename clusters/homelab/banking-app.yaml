apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: banking-app
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: master
  url: https://github.com/abubakar-tq/banking-microservices-app

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: banking-app
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s/overlays/homelab
  prune: true
  wait: true
  timeout: 5m0s
  targetNamespace: banking-app
  sourceRef:
    kind: GitRepository
    name: banking-app
  decryption:
    provider: sops
    secretRef:
      name: sops-age

